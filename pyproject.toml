[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "easy-clipboard-manager"
version = "1.0.0"
description = "A lightweight, privacy-first clipboard history manager for Windows."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "kritagyadubey" }]
keywords = ["clipboard", "history", "windows", "qt", "privacy"]
classifiers = [
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment",
]
dependencies = ["PySide6>=6.6,<7"]

[project.urls]
Homepage = "https://github.com/kritagyadubey/Easy-Clipboard-Manager"
Issues = "https://github.com/kritagyadubey/Easy-Clipboard-Manager/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyflakes>=3.0", "pyinstaller>=6.0"]

[project.scripts]
easy-clipboard-manager = "easy_clipboard.app:run"

[tool.setuptools.packages.find]
include = ["easy_clipboard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
